# One-click deploy on Render (render.com -> New -> Blueprint -> pick this repo).
# One free web service runs the API, the live updates and the built web app on one URL.
services:
  - type: web
    name: goldenhour
    runtime: node
    plan: free
    region: singapore # closest Render region to Pakistan
    # The API is compiled to plain JavaScript (no TypeScript runtime): much less memory on the 512 MB free plan.
    buildCommand: npm install -g pnpm@11.9.0 && pnpm install --frozen-lockfile && pnpm build && pnpm --filter @gh/api build
    startCommand: cd apps/api && node dist/index.mjs
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "24"
      # Security: generated once by Render and kept across deploys.
      - key: AUTH_SECRET
        generateValue: true
      - key: DATA_KEY
        generateValue: true
      - key: REPORTER_HASH_SALT
        generateValue: true
      # Asked for when you create the Blueprint.
      - key: STAFF_PIN # PIN for the staff screens; give it to judges in the submission's testing notes
        sync: false
      - key: LLM_API_KEY # Gemini key from aistudio.google.com/apikey (empty = rules-only)
        sync: false
      - key: LLM_BASE_URL
        value: https://generativelanguage.googleapis.com/v1beta/openai
      - key: LLM_MODEL
        value: gemini-2.5-flash
      # REQUIRED on the free plan: a Neon Postgres connection string (neon.tech -> Connect).
      # The built-in embedded database needs ~650 MB the first time it starts, more than the free 512 MB.
      # With Neon the server uses about 230 MB, and the data survives restarts.
      - key: DATABASE_URL
        sync: false
      # Collect garbage before the 512 MB limit instead of after.
      - key: NODE_OPTIONS
        value: --max-old-space-size=400
      - key: EMERGENCY_NUMBER
        value: "1122"
